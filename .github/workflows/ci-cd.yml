name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mlops-api
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/ scripts/ monitoring/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  validate-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic_data.py --rows 2000 --output data/raw/churn.csv

      - name: Preprocess
        run: python src/data/preprocess.py --input data/raw/churn.csv --output data/processed

      - name: Train (MLflow local SQLite)
        run: python src/train.py --train data/processed/train.csv --test data/processed/test.csv --model-dir models
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Quality gate (synthetic data threshold = 0.45)
        run: python scripts/validate_metrics.py
        env:
          # Synthetic dataset: lower threshold. Real Kaggle dataset: set to 0.75
          QUALITY_GATE_F1: "0.45"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.pkl
            metrics.json

  build-and-push:
    needs: validate-model
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models/

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
